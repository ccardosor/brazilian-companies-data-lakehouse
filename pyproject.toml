[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brazilian-companies-data-lakehouse"
version = "0.1.0"
description = "Pipeline de ingestao dos dados publicos de CNPJ da Receita Federal."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "dbt-duckdb>=1.10.0",
    "duckdb>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
cnpj-ingestao = "cnpj_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["cnpj_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
